name: Deploy web to GitHub Pages

# Builds the Flutter web app and publishes build/web to GitHub Pages.
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source = "GitHub Actions" (the configure-pages step below also attempts to
# enable this automatically via `enablement: true`).

on:
  push:
    branches:
      - main
      - master
      - claude/flutter-babiauto-api-Kwr7Z
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; newer pushes supersede in-flight runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Attempt to switch the Pages source to GitHub Actions automatically.
          enablement: true

      - name: Install dependencies
        run: flutter pub get

      # base-href must match the path Pages serves from (e.g. /<repo>/ for a
      # project site). configure-pages exposes that as base_path.
      #
      # The site targets the hosted API by default. Override the host (or the
      # demo credentials) with repo variables/secrets
      # (Settings → Secrets and variables → Actions):
      #   API_BASE_URL   default https://babiauto.online/api/v1  (HTTPS + must
      #                  allow CORS from https://<owner>.github.io)
      #   DEMO_EMAIL     optional seeded rider email
      # and optionally a secret DEMO_PASSWORD.
      - name: Build web
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://babiauto.online/api/v1' }}
          DEMO_EMAIL: ${{ vars.DEMO_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          DEFINES=""
          [ -n "$API_BASE_URL" ] && DEFINES="$DEFINES --dart-define=API_BASE_URL=$API_BASE_URL"
          [ -n "$DEMO_EMAIL" ] && DEFINES="$DEFINES --dart-define=DEMO_EMAIL=$DEMO_EMAIL"
          [ -n "$DEMO_PASSWORD" ] && DEFINES="$DEFINES --dart-define=DEMO_PASSWORD=$DEMO_PASSWORD"
          echo "Building with defines:${DEFINES:- (none — demo data)}"
          flutter build web --release --no-tree-shake-icons \
            --base-href "${{ steps.pages.outputs.base_path }}/" $DEFINES

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
